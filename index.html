<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>綠源 專案進度與文件管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --panel-2:#fafbfc; --line:#e3e6ea; --line-2:#eef0f3;
  --txt:#1b2027; --txt-2:#5b6472; --txt-3:#8b95a3;
  --brand:#1f6f4f; --brand-2:#2c8f67; --brand-soft:#e8f4ee;
  --accent:#2563eb; --warn:#c2710c; --warn-soft:#fdf3e3; --danger:#c0392b; --danger-soft:#fdeceb;
  --ok:#1f8a4c; --ok-soft:#e9f6ee; --idle:#8b95a3; --idle-soft:#f0f2f5;
  --plan:#8b95a3; --base:#c9d0d8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.12);
  --r:10px; --sidebar:224px;
}
:root[data-theme="dark"]{
  --bg:#12151a; --panel:#1a1e25; --panel-2:#1f242c; --line:#2b313b; --line-2:#242a32;
  --txt:#e8ecf1; --txt-2:#a4afbd; --txt-3:#78838f;
  --brand:#46b98a; --brand-2:#5ccb9c; --brand-soft:#17302a;
  --accent:#6ea8fe; --warn:#e2a34a; --warn-soft:#2e2718; --danger:#f07a6d; --danger-soft:#33201e;
  --ok:#4cc27c; --ok-soft:#162c1f; --idle:#78838f; --idle-soft:#242a32;
  --plan:#78838f; --base:#3a424e;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 12px 34px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:Inter,"Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;min-height:100vh}
.side{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--panel);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;border-bottom:1px solid var(--line-2)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--brand),var(--brand-2));
  display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;letter-spacing:.5px}
.brand b{font-size:14px;letter-spacing:.2px}
.brand small{display:block;color:var(--txt-3);font-size:11px;font-weight:400;letter-spacing:.3px}
.nav{padding:10px 10px;flex:1;overflow:auto}
.nav-label{font-size:11px;color:var(--txt-3);padding:12px 8px 6px;letter-spacing:.6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--txt-2);
  font-weight:500;cursor:pointer;margin-bottom:2px;transition:.12s}
.nav a:hover{background:var(--panel-2);color:var(--txt)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a .ic{width:16px;text-align:center;opacity:.9}
.nav a .cnt{margin-left:auto;font-size:11px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.side-foot{padding:10px;border-top:1px solid var(--line-2);display:flex;gap:6px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}

.top{position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--line);
  padding:0 20px;height:56px;display:flex;align-items:center;gap:14px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--txt-3);font-size:13px;min-width:0}
.crumb b{color:var(--txt);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{opacity:.5}
.top .sp{flex:1}
.search{position:relative}
.search input{width:230px;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:8px;
  background:var(--panel-2);outline:none}
.search input:focus{border-color:var(--brand);background:var(--panel)}
.search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--txt-3);font-size:13px}
.content{padding:20px;flex:1;min-width:0}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-weight:500;transition:.12s;white-space:nowrap}
.btn:hover{background:var(--panel-2);border-color:var(--txt-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-2);border-color:var(--brand-2)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.gh{border-color:transparent;background:transparent;color:var(--txt-2)}
.btn.gh:hover{background:var(--panel-2);color:var(--txt)}
.btn.dgr{color:var(--danger)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;
  background:var(--idle-soft);color:var(--txt-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.run{background:#e8effd;color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--danger-soft);color:var(--danger)}
:root[data-theme="dark"] .pill.run{background:#1b2740}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 7px}
.muted{color:var(--txt-3)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid{display:grid;gap:14px}
.empty{padding:50px 20px;text-align:center;color:var(--txt-3)}
.empty .big{font-size:34px;opacity:.35;margin-bottom:10px}
input[type=range]{accent-color:var(--brand);cursor:pointer}

table.tbl{width:100%;border-collapse:separate;border-spacing:0}
table.tbl th{position:sticky;top:0;background:var(--panel-2);text-align:left;font-size:12px;font-weight:600;
  color:var(--txt-2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl tbody tr:last-child td{border-bottom:none}
.star{cursor:pointer;color:var(--line);font-size:16px;line-height:1}
.star.on{color:#e8b023}
.link{color:var(--brand);font-weight:600;cursor:pointer}
.link:hover{text-decoration:underline}

.bar{height:6px;border-radius:99px;background:var(--line-2);overflow:visible;min-width:56px;position:relative}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.bar.late i{background:var(--danger)}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--plan);border-radius:2px}

.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:12px;color:var(--txt-2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

.mask{position:fixed;inset:0;background:rgba(15,20,28,.45);backdrop-filter:blur(2px);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto}
.modal{background:var(--panel);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;
  border:1px solid var(--line);animation:pop .15s ease-out}
.modal.wide{max-width:900px}
@keyframes pop{from{opacity:0;transform:translateY(-8px)}}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:8px}
.modal-h h3{margin:0;font-size:15px;flex:1}
.modal-b{padding:18px;max-height:calc(100vh - 220px);overflow:auto}
.modal-f{padding:14px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;
  justify-content:flex-end;flex-wrap:wrap}
.mtabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--line-2)}
.mtabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--txt-2);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.mtabs button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;background:var(--panel);
  position:sticky;top:56px;z-index:14}
.tabs a{padding:11px 14px;font-weight:500;color:var(--txt-2);border-bottom:2px solid transparent;cursor:pointer;
  margin-bottom:-1px;white-space:nowrap}
.tabs a:hover{color:var(--txt)}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .lb{font-size:12px;color:var(--txt-3);font-weight:500}
.kpi .vl{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:11.5px;color:var(--txt-3);margin-top:2px}
.kpi.bad .vl{color:var(--danger)} .kpi.good .vl{color:var(--ok)}

.log{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
.log .it{position:relative;padding:0 0 14px}
.log .it:before{content:'';position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;
  background:var(--brand);border:2px solid var(--panel)}
.log .mt{font-size:11.5px;color:var(--txt-3);font-variant-numeric:tabular-nums}
.log .bd{white-space:pre-wrap;font-size:13px;margin-top:2px}

.gantt-wrap{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel);
  box-shadow:var(--shadow)}
.g-left{flex:0 0 430px;border-right:1px solid var(--line);overflow:hidden}
.g-right{flex:1;overflow-x:auto;overflow-y:hidden;position:relative}
.g-head{height:52px;background:var(--panel-2);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;
  font-size:12px;color:var(--txt-2);position:sticky;top:0;z-index:3}
.g-left .g-head{padding:0 12px 9px;font-weight:600}
.g-row{height:34px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;font-size:13px}
.g-row:hover{background:var(--panel-2)}
.g-left .g-row{padding:0 12px;gap:8px}
.g-row.sum{font-weight:700;background:var(--panel-2)}
.g-code{color:var(--txt-3);font-size:11.5px;width:48px;flex:0 0 48px;font-variant-numeric:tabular-nums}
.g-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.g-name:hover{color:var(--brand)}
.g-canvas{position:relative}
.g-months{display:flex;height:26px;border-bottom:1px solid var(--line-2)}
.g-month{border-right:1px solid var(--line);font-size:11.5px;font-weight:600;padding:5px 6px;
  white-space:nowrap;overflow:hidden;color:var(--txt-2)}
.g-days{display:flex;height:26px}
.g-day{border-right:1px solid var(--line-2);font-size:10px;text-align:center;color:var(--txt-3);padding-top:6px;
  flex:0 0 auto;overflow:hidden}
.g-day.we{background:var(--panel-2)}
.g-grid{position:absolute;inset:0;pointer-events:none}
.g-grid .we{position:absolute;top:0;bottom:0;background:var(--panel-2);opacity:.75}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);opacity:.6;z-index:4}
.g-base{position:absolute;height:7px;border-radius:3px;background:var(--base);top:5px}
.g-bar{position:absolute;height:14px;border-radius:4px;background:var(--brand);top:14px;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.18);overflow:hidden}
.g-bar:hover{filter:brightness(1.12)}
.g-bar.crit{background:var(--danger)}
.g-bar.done{background:var(--ok)}
.g-bar.summary{height:9px;top:12px;border-radius:3px;background:var(--txt-2)}
.g-bar i{position:absolute;right:0;top:0;bottom:0;background:rgba(255,255,255,.5)}
.g-lb{position:absolute;font-size:11px;color:var(--txt-3);white-space:nowrap}
.g-ms{position:absolute;width:12px;height:12px;background:var(--warn);transform:rotate(45deg);top:14px;border-radius:2px}

.doc-lay{display:flex;gap:14px;align-items:flex-start}
.tree{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:8px;
  box-shadow:var(--shadow);max-height:calc(100vh - 190px);overflow:auto}
.tnode{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px;
  color:var(--txt-2);user-select:none}
.tnode:hover{background:var(--panel-2);color:var(--txt)}
.tnode.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.tnode .tw{width:14px;text-align:center;font-size:10px;color:var(--txt-3)}
.tnode .cnt{margin-left:auto;font-size:11px;color:var(--txt-3)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--txt-3);
  background:var(--panel);margin-bottom:12px;transition:.15s;font-size:13px}
.drop.hot{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:14px}
.fcard{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--panel-2);cursor:pointer;transition:.12s}
.fcard:hover{border-color:var(--brand);transform:translateY(-1px);box-shadow:var(--shadow)}
.fcard .ico{font-size:26px;margin-bottom:8px}
.fcard .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 11px;cursor:pointer;color:var(--txt-2);font-size:12.5px}
.seg button.on{background:var(--brand);color:#fff}
.tag{display:inline-block;padding:1px 7px;border-radius:5px;background:var(--brand-soft);color:var(--brand);
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums}

/* 表單：檢查項目（手機也好按） */
.fgridx{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:0 12px}
.cklist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ck{display:grid;grid-template-columns:1fr auto 200px;gap:10px;align-items:center;
  padding:10px 12px;border-bottom:1px solid var(--line-2)}
.ck:last-child{border-bottom:none}
.ck:nth-child(odd){background:var(--panel-2)}
.ck-t{font-size:13px;line-height:1.45}
.ck-r{display:flex;gap:5px}
.ck-b{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;
  cursor:pointer;font-size:12.5px;color:var(--txt-2);min-width:58px;transition:.12s;white-space:nowrap}
.ck-b:hover{border-color:var(--txt-3)}
.ck-b.on.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
.ck-b.on.ng{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.ck-b.on.na{background:var(--txt-3);border-color:var(--txt-3);color:#fff;font-weight:600}
.ck-n{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);
  outline:none;font-size:12.5px;width:100%}
.ck-n:focus{border-color:var(--brand)}
@media(max-width:720px){
  .ck{grid-template-columns:1fr;gap:8px}
  .ck-b{flex:1;padding:10px 8px;font-size:13px}
  .modal-b{padding:14px}
  .row2,.row3,.row4,.fgridx{grid-template-columns:1fr}
  .mask{padding:0}
  .modal{border-radius:0;min-height:100vh;max-width:100%;overflow:hidden}
  .modal-h h3{font-size:14px;overflow:hidden;text-overflow:ellipsis}
  .modal-f{padding:12px 14px}
  .modal-f .btn{flex:1 1 44%;justify-content:center}
  .modal-f .btn[style*="margin-right:auto"]{flex:1 1 100%;margin-right:0!important}
  .cklist{overflow:hidden}
}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filters select,.filters input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);outline:none}
.nosave{position:fixed;left:0;right:0;bottom:0;z-index:400;background:var(--warn-soft);
  color:var(--warn);border-top:1px solid var(--warn);padding:11px 18px;font-size:13px;
  display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;font-weight:500}
.nosave b{color:var(--txt)}
.nosave button{border:1px solid var(--warn);background:transparent;color:var(--warn);
  border-radius:7px;padding:3px 10px;cursor:pointer;font-size:12.5px;font-weight:600}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--txt);color:var(--bg);
  padding:10px 18px;border-radius:10px;z-index:300;box-shadow:var(--shadow-lg);font-weight:500;font-size:13px}
.burger{display:none;font-size:17px;padding:5px 9px;margin-left:-6px}
.side-mask{display:none;position:fixed;inset:0;background:rgba(15,20,28,.4);z-index:19}
.side-mask.on{display:block}
@media(max-width:1000px){
  .burger{display:inline-flex}
  .side{position:fixed;left:-240px;transition:left .2s;box-shadow:var(--shadow-lg)}
  .side.open{left:0}
  .search input{width:150px}
  .doc-lay{flex-direction:column}.tree{flex:none;width:100%;max-height:220px}
  .g-left{flex:0 0 200px}
  .content{padding:14px}
  .tabs{padding:0 14px;overflow-x:auto}
}
@media(max-width:620px){
  .top{padding:0 12px;gap:8px}
  .crumb b{font-size:14px}
  .crumb span:not(.sep){display:none}
  .search input{width:110px}
  .kpis{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
  <div class="side-mask" id="sideMask" onclick="toggleSide()"></div>
  <aside class="side" id="side">
    <div class="brand">
      <div class="mark">GS</div>
      <div><b>專案管理中心</b><small>EPC Project Hub</small></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn sm gh" onclick="toggleTheme()" title="切換深淺色">🌓 外觀</button>
      <button class="btn sm gh" onclick="openBackup()" title="備份 / 還原">💾 資料</button>
    </div>
  </aside>
  <main class="main">
    <header class="top">
      <button class="btn gh burger" onclick="toggleSide()" title="選單">☰</button>
      <div class="crumb" id="crumb"></div>
      <div class="sp"></div>
      <div class="search"><span class="ic">🔍</span><input id="q" placeholder="搜尋專案、任務、文件…" oninput="onSearch(this.value)"></div>
      <button class="btn pri" onclick="newProject()">＋ 新增專案</button>
    </header>
    <div id="tabs"></div>
    <div class="content" id="view"></div>
  </main>
</div>
<div id="modal"></div>
<script>
/* =======================================================================
   綠源 專案進度與文件管理
   資料模型對齊現用 ezteamwork：權重彙總、進度模型、三軌日期、進度日誌、
   文件掛 WBS 任務。資料存 localStorage，可匯出 JSON 放公司雲端硬碟。
   ======================================================================= */

/* ---------- EPC 標準時程範本（來源：EPC時程.xls） ---------- */
const EPC_TEMPLATE = `
1|案場資訊||
1.1|土地/建物現況勘整|5|

const KEY='gs_pm_db_v3';
let DB = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return migrate(JSON.parse(raw));
    const old = localStorage.getItem('gs_pm_db_v2');
    if(old) return migrate(JSON.parse(old));
  }catch(e){ console.warn('讀取失敗，改用預設資料',e); }
  return seed();
}
let CAN_SAVE=true;
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DB,(k,v)=>k.startsWith('_')?undefined:v));
    if(!CAN_SAVE){ CAN_SAVE=true; const b=$('#nosave'); if(b) b.remove(); }
  }catch(e){
    if(CAN_SAVE){ CAN_SAVE=false; warnNoSave(); }
  }
}
/** 這個環境不能存檔時，明確告知，免得白做工 */
function warnNoSave(){
  if(document.readyState==='loading'){ addEventListener('DOMContentLoaded',warnNoSave); return; }
  if($('#nosave')) return;
  const d=document.createElement('div');
  d.id='nosave'; d.className='nosave';
  d.innerHTML=`⚠ 這個開啟方式無法存檔，離開後資料會消失。請把檔案存到電腦後，用
    <b>Chrome 或 Edge 直接開啟</b>（點兩下），或先用左下角「資料 → 匯出 JSON」留存。
    <button onclick="this.parentElement.remove()">知道了</button>`;
  document.body.appendChild(d);
}
function uid(){ return Math.random().toString(36).slice(2,10); }

/** 補齊舊版缺少的欄位 */
function migrate(db){
  if(!db.formTpls||!db.formTpls.length) db.formTpls=JSON.parse(JSON.stringify(FORM_TEMPLATES));
  (db.projects||[]).forEach(p=>{
    p.calendarMode = p.calendarMode || 'cal';
    p.members = p.members || [];
    p.forms = p.forms || [];
    (p.tasks||[]).forEach(t=>{
      if(t.weight==null) t.weight = STAGE_WEIGHT[t.code] ?? 10;
      if(!t.model) t.model = /^收款/.test(t.name) ? '開工法' : '比例法';
      if(!t.logs) t.logs = [];
      if(t.exec==null) t.exec='';
      if(t.ms==null) t.ms = /收款|會議|檢查點|驗收|掛表|複驗/.test(t.name);
      if(t.planStart==null) t.planStart='';
      if(t.planEnd==null) t.planEnd='';
      if(t.actEnd==null) t.actEnd='';
      if(t.expEnd==null) t.expEnd='';
      if(t.hours==null) t.hours='';
    });
    (p.files||[]).forEach(f=>{
      if(f.task==null) f.task='';
      if(!f.cat) f.cat = f.task?'任務相關':'專案基本資料相關';
    });
  });
  db.ver=3; return db;
}

function parseTemplate(){
  return EPC_TEMPLATE.split('\n').map(l=>{
    const [code,name,dur,deps]=l.split('|');
    const c=code.trim(), nm=name.trim();
    return {code:c, name:nm, dur:dur?+dur||0:0, deps:(deps||'').trim(),
            weight:STAGE_WEIGHT[c] ?? 10,
            model:/^收款/.test(nm)?'開工法':'比例法',
            ms:/收款|會議|檢查點|驗收|掛表|複驗/.test(nm),
            owner:'', exec:'', hours:'',
            planStart:'', planEnd:'', actStart:'', actEnd:'', expEnd:'',
            prog:0, note:'', logs:[]};
  });
}
function cloneFolders(list,out=[],parent=''){
  list.forEach(f=>{ out.push({id:f.id,name:f.name,parent}); if(f.children) cloneFolders(f.children,out,f.id); });
  return out;
}

/* =========================== 日期工具 =========================== */
function today(){ return fmt(new Date()); }
function todayD(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function fmt(d){ if(!d) return ''; const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function D(s){ if(!s) return null; const [y,m,d]=String(s).split('-').map(Number);
  if(!y||!m||!d) return null; return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function isWE(d){ const w=d.getDay(); return w===0||w===6; }
function shift(d,n,mode){
  if(mode!=='work') return addDays(d,n);
  let x=new Date(d), step=n>=0?1:-1, left=Math.abs(n);
  while(left>0){ x=addDays(x,step); if(!isWE(x)) left--; }
  return x;
}
function snapFwd(d,mode){ let x=new Date(d); if(mode==='work') while(isWE(x)) x=addDays(x,1); return x; }
function diffDays(a,b){ return Math.round((b-a)/86400000); }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

/* =========================== 排程引擎 =========================== */
/**
 * 預定（baseline）日期：有手動填 planStart/planEnd 就用手填的，
 * 否則依 WBS 前置任務語法 {code}{FS|SS|FF|SF}{lag} 自動推算。
 * 摘要任務的起迄由子項彙總。
 */
function schedule(p){
  const mode=p.calendarMode||'cal';
  const base=snapFwd(D(p.start)||new Date(), mode);
  const map={}, kids={};
  p.tasks.forEach(t=>map[t.code]=t);
  p.tasks.forEach(t=>{ const i=t.code.lastIndexOf('.');
    if(i>0){ const pa=t.code.slice(0,i); if(map[pa]) (kids[pa]=kids[pa]||[]).push(t.code); } });
  const isSum=c=>!!kids[c];
  const memo={}, visiting={};

  function calc(code){
    if(memo[code]) return memo[code];
    const t=map[code];
    if(!t) return {s:base,e:base};
    if(visiting[code]) return {s:base,e:base};          // 防循環相依
    visiting[code]=true;
    let r;
    if(isSum(code)){
      const cs=kids[code].map(calc);
      r={s:new Date(Math.min(...cs.map(x=>+x.s))), e:new Date(Math.max(...cs.map(x=>+x.e)))};
    }else if(t.planStart && t.planEnd){
      r={s:D(t.planStart), e:D(t.planEnd)};
    }else{
      const dur=Math.max(1,t.dur||1);
      let s=t.planStart?D(t.planStart):base;
      if(!t.planStart && t.deps){
        t.deps.split(',').map(x=>x.trim()).filter(Boolean).forEach(dep=>{
          const m=dep.match(/^([\d.]+)(FS|SS|FF|SF)(-?\d+)$/i);
          if(!m||!map[m[1]]) return;
          const pr=calc(m[1]), ty=m[2].toUpperCase(), lag=+m[3];
          let cand;
          if(ty==='FS')      cand=shift(pr.e, 1+lag, mode);
          else if(ty==='SS') cand=shift(pr.s, lag, mode);
          else if(ty==='FF') cand=shift(shift(pr.e, lag, mode), -(dur-1), mode);
          else               cand=shift(shift(pr.s, lag, mode), -(dur-1), mode);
          if(cand>s) s=cand;
        });
      }
      s=snapFwd(s,mode);
      r={s, e:shift(s,dur-1,mode)};
    }
    delete visiting[code];
    return memo[code]=r;
  }

  p.tasks.forEach(t=>{
    const r=calc(t.code);
    t._s=r.s; t._e=r.e; t._sum=isSum(t.code);
    t._as=D(t.actStart); t._ae=D(t.actEnd);
    t._ee=D(t.expEnd)||t._ae||null;                     // 預期完成：沒填就用實際完成
  });

  function leaves(code){
    const out=[];
    (function walk(c){ if(kids[c]) kids[c].forEach(walk); else if(map[c]) out.push(map[c]); })(code);
    return out;
  }
  // 摘要任務的實際/預期日期由子項彙總
  p.tasks.filter(t=>t._sum).forEach(t=>{
    const lv=leaves(t.code);
    const as=lv.map(x=>x._as).filter(Boolean),
          ae=lv.map(x=>x._ae).filter(Boolean),
          ee=lv.map(x=>x._ee||x._e).filter(Boolean);
    t._as = as.length?new Date(Math.min(...as)):null;
    t._ae = (lv.length&&ae.length===lv.length)?new Date(Math.max(...ae)):null;
    t._ee = ee.length?new Date(Math.max(...ee)):null;
  });

  // 反推最晚完成 → 浮時 / 要徑
  const succ={};
  p.tasks.forEach(t=>{ if(!t.deps) return;
    t.deps.split(',').map(x=>x.trim()).filter(Boolean).forEach(dep=>{
      const m=dep.match(/^([\d.]+)(FS|SS|FF|SF)(-?\d+)$/i); if(!m) return;
      (succ[m[1]]=succ[m[1]]||[]).push({to:t.code,ty:m[2].toUpperCase(),lag:+m[3]});
    });
  });
  const projEnd=new Date(Math.max(...p.tasks.map(t=>+t._e)));
  const lf={};
  function lateF(code){
    if(lf[code]) return lf[code];
    lf[code]=projEnd;                                    // 先佔位防循環
    const t=map[code];
    let v=projEnd;
    (succ[code]||[]).forEach(s=>{
      const st=map[s.to]; if(!st) return;
      const sLF=lateF(s.to), sLS=shift(sLF, -(Math.max(1,st.dur||1)-1), mode);
      let c;
      if(s.ty==='FS')      c=shift(sLS, -(1+s.lag), mode);
      else if(s.ty==='SS') c=shift(shift(sLS, -s.lag, mode), Math.max(1,(t.dur||1))-1, mode);
      else                 c=shift(sLF, -s.lag, mode);
      if(c<v) v=c;
    });
    return lf[code]=v;
  }
  p.tasks.forEach(t=>{
    if(t._sum){ t._float=0; t._crit=false; return; }
    t._float=diffDays(t._e, lateF(t.code)); t._crit=t._float<=0;
  });

  p._map=map; p._kids=kids;
  p._roots=p.tasks.filter(t=>!t.code.includes('.')).map(t=>t.code);
  p._start=new Date(Math.min(...p.tasks.map(t=>+t._s)));
  p._end=projEnd;
  p._fcEnd=new Date(Math.max(...p.tasks.map(t=>+(t._ee||t._e))));   // 預期完工

  // 進度（依權重彙總）
  const n=todayD();
  p.tasks.forEach(t=>{
    t._prog=rollAt(p,t.code,x=>x.prog||0);
    t._plan=rollAt(p,t.code,x=>plannedOf(x,n));
  });
  p._prog=rollAll(p,x=>x.prog||0);
  p._plan=rollAll(p,x=>plannedOf(x,n));
  return p;
}

/** 權重彙總：葉節點取 fn(task)，父節點用子項權重加權平均 */
function rollAt(p,code,fn){
  const k=p._kids[code];
  if(!k||!k.length) return fn(p._map[code])||0;
  let w=0,s=0;
  k.forEach(c=>{ const t=p._map[c], ww=Math.max(0,+t.weight||0); w+=ww; s+=ww*rollAt(p,c,fn); });
  return w? s/w : 0;
}
function rollAll(p,fn){
  let w=0,s=0;
  p._roots.forEach(c=>{ const t=p._map[c], ww=Math.max(0,+t.weight||0); w+=ww; s+=ww*rollAt(p,c,fn); });
  return w? s/w : 0;
}
/** 預定進度：到某日為止「照計畫」應該完成多少 */
function plannedOf(t,d){
  if(!t||!t._s||!t._e) return 0;
  if(t.model==='開工法') return d>=t._s?100:0;
  if(d<t._s) return 0;
  if(d>=t._e) return 100;
  return clamp((diffDays(t._s,d)+1)/(diffDays(t._s,t._e)+1)*100,0,100);
}
/** 實際進度回推到某日（供 S 曲線用） */
function actualOf(t,d){
  if(!t) return 0;
  if(t._ae && d>=t._ae) return t.prog||100;
  if(!t._as || d<t._as) return 0;
  const n=todayD();
  if(d>=n || t.model==='開工法') return t.prog||0;
  const end=t._ee||t._e;
  const span=Math.max(1,diffDays(t._as,end)+1);
  return clamp((diffDays(t._as,d)+1)/span*100, 0, t.prog||0);
}

function taskStatus(t){
  const n=todayD();
  if((t._prog||0)>=99.5) return {k:'已完成',c:'ok'};
  const due=t._ee||t._e;
  if(due&&due<n) return {k:'逾期',c:'late'};
  if((t._prog||0)>0) return {k:'進行中',c:'run'};
  if(t._s&&t._s<=n) return {k:'應開始',c:'warn'};
  return {k:'未開始',c:''};
}
/** 進度偏差：實際 − 預定，負數代表落後 */
function variance(t){ return (t._prog||0)-(t._plan||0); }

let route={view:'projects',id:null,tab:'overview'};

/**
 * 直接切換畫面，不等 hashchange。
 * 有些開啟方式（沙箱預覽、某些 file:// 情境）改不了 location.hash，
 * 只靠 hashchange 會整個點不動，所以這裡自己記狀態、自己重畫。
 */
function go(h){
  CURHASH=h;
  if(location.hash!==h){ try{ location.hash=h; }catch(e){} }
  const s=$('#side'); if(s&&s.classList.contains('open')) toggleSide();   // 窄螢幕點完自動收起
  parseHash(); render();
}
function parseHash(){
  const h=(CURHASH||'#/projects').slice(2).split('/');
  if(h[0]==='p'&&h[1]) route={view:'project',id:h[1],tab:h[2]||'overview'};
  else if(h[0]==='star') route={view:'projects',star:true};
  else if(h[0]==='tasks') route={view:'mytasks'};
  else if(h[0]==='files') route={view:'allfiles'};
  else route={view:'projects'};
}
/** 只處理「使用者按上一頁／直接改網址」造成的變動，自己按的分頁已經畫過了 */
window.addEventListener('hashchange',()=>{
  if(location.hash && location.hash.startsWith('#/') && location.hash!==CURHASH){
    CURHASH=location.hash; parseHash(); render();
  }
});

/** S 曲線：每週取樣，預定虛線、實際實線（只畫到今天） */
function sCurve(p){
  const W=980,H=210,PL=38,PR=14,PT=12,PB=26;
  const s=p._start, e=new Date(Math.max(+p._end,+p._fcEnd));
  const days=Math.max(1,diffDays(s,e));
  const n=todayD(), pts=[];
  for(let i=0;i<=days;i+=7){
    const d=addDays(s,i);
    pts.push({d,plan:rollAll(p,t=>plannedOf(t,d)),act:d<=n?rollAll(p,t=>actualOf(t,d)):null});
  }
  if(pts[pts.length-1].d<e) pts.push({d:e,plan:rollAll(p,t=>plannedOf(t,e)),act:e<=n?rollAll(p,t=>actualOf(t,e)):null});
  const X=d=>PL+diffDays(s,d)/days*(W-PL-PR);
  const Y=v=>PT+(1-v/100)*(H-PT-PB);
  const line=key=>pts.filter(q=>q[key]!=null).map((q,i)=>(i?'L':'M')+X(q.d).toFixed(1)+' '+Y(q[key]).toFixed(1)).join(' ');
  const months=[];
  for(let i=0;i<=days;i++){ const d=addDays(s,i); if(d.getDate()===1||i===0) months.push(d); }
  const nx=X(n), last=pts.filter(q=>q.act!=null).pop();

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:210px;display:block" preserveAspectRatio="none">
    ${[0,25,50,75,100].map(v=>`
      <line x1="${PL}" y1="${Y(v)}" x2="${W-PR}" y2="${Y(v)}" stroke="var(--line-2)" stroke-width="1"/>
      <text x="${PL-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--txt-3)">${v}%</text>`).join('')}
    ${months.filter((d,i)=>months.length<16||i%2===0).map(d=>`
      <text x="${X(d)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--txt-3)">${d.getMonth()+1}月</text>`).join('')}
    ${n>=s&&n<=e?`<line x1="${nx}" y1="${PT}" x2="${nx}" y2="${H-PB}" stroke="var(--danger)" stroke-width="1.5" opacity=".55" stroke-dasharray="4 3"/>`:''}
    <path d="${line('plan')}" fill="none" stroke="var(--plan)" stroke-width="2" stroke-dasharray="6 4"/>
    <path d="${line('act')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
    ${last?`<circle cx="${X(last.d)}" cy="${Y(last.act)}" r="4" fill="var(--brand)"/>`:''}
  </svg>`;
}

/* ---------- 甘特圖 ---------- */
let zoom=6;
function viewGantt(p){
  const s0=addDays(p._start,-3), e0=addDays(new Date(Math.max(+p._end,+p._fcEnd)),5);
  const total=diffDays(s0,e0)+1, W=zoom;
  const months=[];
  for(let i=0;i<total;i++){
    const d=addDays(s0,i), k=d.getFullYear()+'-'+(d.getMonth()+1);
    if(!months.length||months[months.length-1].k!==k)
      months.push({k,label:(d.getMonth()+1)+' 月 '+(d.getMonth()===0||i===0?d.getFullYear():''),n:0});
    months[months.length-1].n++;
  }
  const dayCells=W>=14?Array.from({length:total},(_,i)=>{const d=addDays(s0,i);
    return `<div class="g-day ${isWE(d)?'we':''}" style="width:${W}px">${d.getDate()}</div>`;}).join(''):'';
  const weBands=W>=4?Array.from({length:total},(_,i)=>{const d=addDays(s0,i);
    return isWE(d)?`<div class="we" style="left:${i*W}px;width:${W}px"></div>`:'';}).join(''):'';
  const todayX=diffDays(s0,todayD())*W;

  return `
  <div class="filters">
    <span class="muted">縮放</span>
    <div class="seg">${[['日',18],['週',6],['月',2.6]].map(([l,z])=>
      `<button class="${zoom==z?'on':''}" onclick="zoom=${z};render()">${l}</button>`).join('')}</div>
    <div style="flex:1"></div>
    <span class="pill"><span class="dot" style="color:var(--base)"></span>預定</span>
    <span class="pill"><span class="dot" style="color:var(--brand)"></span>實際</span>
    <span class="pill late"><span class="dot"></span>要徑</span>
    <span class="muted" style="font-size:12.5px">${fmt(p._start)} ～ ${fmt(p._fcEnd)}</span>
  </div>
  <div class="gantt-wrap" style="max-height:calc(100vh - 230px)">
    <div class="g-left">
      <div class="g-head" style="padding-bottom:9px">任務</div>
      <div id="glb">${p.tasks.map(t=>`
        <div class="g-row ${t._sum?'sum':''}">
          <span class="g-code">${t.code}</span>
          <span class="g-name" title="${esc(t.name)}" ${t._sum?'':`onclick="editTask('${p.id}','${t.code}')"`}>${esc(t.name)}</span>
        </div>`).join('')}</div>
    </div>
    <div class="g-right" id="gr" onscroll="document.getElementById('glb').style.transform='translateY(-'+this.scrollTop+'px)'">
      <div class="g-canvas" style="width:${total*W}px">
        <div class="g-head" style="width:${total*W}px;display:block;height:52px">
          <div class="g-months">${months.map(m=>`<div class="g-month" style="width:${m.n*W}px">${m.label}</div>`).join('')}</div>
          <div class="g-days">${dayCells}</div>
        </div>
        <div style="position:relative;height:${p.tasks.length*34}px">
          <div class="g-grid">${weBands}</div>
          ${todayX>=0&&todayX<=total*W?`<div class="g-today" style="left:${todayX}px"></div>`:''}
          ${p.tasks.map((t,i)=>{
            const y=i*34;
            const bx=diffDays(s0,t._s)*W, bw=Math.max(W,(diffDays(t._s,t._e)+1)*W);
            const aS=t._as, aE=t._ae||t._ee||todayD();
            const ax=aS?diffDays(s0,aS)*W:0, aw=aS?Math.max(W,(diffDays(aS,aE)+1)*W):0;
            const cls=t._sum?'summary':(t._prog>=99.5?'done':(t._crit?'crit':''));
            const tip=`${esc(t.name)}｜預定 ${fmt(t._s)}~${fmt(t._e)}${aS?`｜實際 ${fmt(aS)}~${t._ae?fmt(t._ae):'進行中'}`:''}｜${pct(t._prog)}%`;
            const x=aS?ax:bx, w=aS?aw:bw;
            const row=`<div style="position:absolute;top:${y}px;left:0;right:0;height:34px;border-bottom:1px solid var(--line-2)"></div>`;
            if(t.ms&&!t._sum)
              return row+`<div class="g-ms" style="left:${x}px;top:${y+14}px" title="${tip}"
                onclick="editTask('${p.id}','${t.code}')"></div>`;
            return row
              +(t._sum?'':`<div class="g-base" style="left:${bx}px;width:${bw}px;top:${y+5}px" title="預定 ${fmt(t._s)} ~ ${fmt(t._e)}"></div>`)
              +`<div class="g-bar ${cls}" style="left:${x}px;width:${w}px;top:${y+(t._sum?12:14)}px" title="${tip}"
                  ${t._sum?'':`onclick="editTask('${p.id}','${t.code}')"`}>
                  ${t._sum?'':`<i style="width:${100-clamp(t._prog,0,100)}%"></i>`}</div>`
              +(W>=10?`<div class="g-lb" style="left:${x+w+6}px;top:${y+12}px">${pct(t._prog)}%</div>`:'');
          }).join('')}
        </div>
      </div>
    </div>
  </div>`;
}

function fileIcon(t){ t=(t||'').toLowerCase();
  if(/pdf/.test(t))return'📕'; if(/docx?/.test(t))return'📘'; if(/xlsx?|csv/.test(t))return'📗';
  if(/pptx?/.test(t))return'📙'; if(/dwg|dxf/.test(t))return'📐'; if(/jpe?g|png|gif/.test(t))return'🖼️';
  if(/zip|rar|7z/.test(t))return'🗜️'; return'🗎'; }
function flowCls(s){ return (s==='已核准'||s==='已歸檔')?'ok':s==='審核中'?'run':s==='退件'?'late':''; }
function bindDrop(p){
  const d=$('#drop'); if(!d) return;
  ['dragenter','dragover'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.add('hot')}));
  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('hot')}));
  d.addEventListener('drop',ev=>{
    const fs=[...(ev.dataTransfer.files||[])]; if(!fs.length) return;
    const folder=curFolder||p.folders[0].id;
    fs.forEach(f=>{
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      p.files.push({id:uid(),folder,cat:docTask?'任務相關':'專案基本資料相關',task:docTask||'',
        name:f.name,no:nextDocNo(p,folder),type:ext,flowOwner:'',flow:'未送審',url:'',mt:Date.now()});
    });
    save(); render(); toast(`已建檔 ${fs.length} 筆（檔案本體請放雲端硬碟後補連結）`);
  });
}
function nextDocNo(p,folder){
  const n=p.files.filter(f=>f.folder===folder).length+1;
  return `GS-${folder}-${String(n).padStart(3,'0')}`;
}

function setCheck(pid,fid,i,r){

function editTpl(id){
  const t=tpl(id);
  modal('編輯範本：'+esc(t.name),`<div class="modal-b">
    <div class="row2">
      <label class="field"><span>表單名稱</span><input id="tp_name" value="${esc(t.name)}"></label>
      <label class="field"><span>分類</span><input id="tp_group" value="${esc(t.group)}"></label>
    </div>
    <label class="field"><span>欄位（每行一個：標題｜型別 text/area/date/num/sel｜選項以逗號分隔｜必填填 *）</span>
      <textarea id="tp_fields" rows="7" style="font-family:ui-monospace,monospace;font-size:12.5px">${
        esc(t.fields.map(f=>[f.l,f.t,(f.o||[]).join(','),f.req?'*':''].join('|').replace(/\|+$/,'')).join('\n'))}</textarea></label>
    <label class="field"><span>檢查項目（每行一項，留空代表這張表沒有勾選項）</span>
      <textarea id="tp_items" rows="9" style="font-size:12.5px">${esc((t.items||[]).join('\n'))}</textarea></label>
    </div>`,
    `<button class="btn" onclick="manageTpls()">返回</button>
     <button class="btn pri" onclick="saveTpl('${id}')">儲存範本</button>`,true);
}
function saveTpl(id){
  const t=DB.formTpls.find(x=>x.id===id); if(!t) return;
  const name=val('tp_name'); if(!name) return toast('請輸入表單名稱');
  const old=t.fields.slice();
  const fields=val('tp_fields').split('\n').map(s=>s.trim()).filter(Boolean).map((line,i)=>{
    const [l,ty,opts,req]=line.split('|').map(s=>(s||'').trim());
    const t2=['text','area','date','num','sel'].includes(ty)?ty:'text';
    // 標題沒變就沿用原 key，已填寫的表單資料才不會對不上
    const same=old.find(f=>f.l===l) || (old[i]&&old[i].l===l?old[i]:null);
    const k=same?same.k:(l.replace(/[^\w一-鿿]/g,'')||('f'+Math.random().toString(36).slice(2,6)));
    const o={k,l,t:t2};
    if(t2==='sel') o.o=(opts||'').split(',').map(s=>s.trim()).filter(Boolean);
    if(req==='*'||opts==='*') o.req=1;
    return o;
  });
  if(!fields.length) return toast('至少要有一個欄位');
  t.name=name; t.group=val('tp_group')||'其他'; t.fields=fields;
  t.items=val('tp_items').split('\n').map(s=>s.trim()).filter(Boolean);
  save(); manageTpls(); toast('範本已更新');
}

  const t=DB.projects.find(x=>x.id===pid).tasks.find(t=>t.code===code);

    <label class="field"><span>前置任務</span><input id="t_deps" value="${esc(t.deps||'')}" placeholder="例 2.1FS0,3.4FS-3"></label>
    <div class="muted" style="font-size:12px;margin:-6px 0 12px">
      語法：<b>編碼＋關係＋延遲天數</b>。FS＝前者完成後開始、SS＝同時開始、FF＝同時完成、SF＝前者開始後完成；延遲可為負數，多筆以逗號分隔。</div>
    <label class="field"><span>備註</span><textarea id="t_note" rows="2">${esc(t.note||'')}</textarea></label>
    ${code?`<div class="muted" style="font-size:12.5px;border-top:1px solid var(--line-2);padding-top:10px">
      預定 ${fmt(t._s)} ～ ${fmt(t._e)}　|　預定進度 ${pct(t._plan)}%、實際 ${pct(t._prog)}%、
      <b style="color:${vcol(vr)}">偏差 ${vr>=0?'+':''}${pct(vr)}%</b>　|
      浮時 ${t._float>=0?t._float:0} 天${t._crit?'　<b style="color:var(--danger)">位於要徑</b>':''}</div>`:''}
    </div>`;

  const logsSorted=(t.logs||[]).map((l,i)=>({l,i})).sort((a,b)=>String(b.l.ts).localeCompare(String(a.l.ts)));
  const logs=`<div class="modal-b">
    <div style="display:flex;gap:8px;margin-bottom:18px">
      <input id="l_text" placeholder="輸入今天的進度說明…" style="flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)">
      <input id="l_who" placeholder="記錄人" value="${esc(t.owner||'')}" style="width:104px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)">
      <button class="btn pri" onclick="addLog('${pid}','${code}')">新增</button>
    </div>
    ${logsSorted.length?`<div class="log">${logsSorted.map(({l,i})=>`
      <div class="it"><div class="mt">${esc(l.ts)}${l.who?'　'+esc(l.who):''}
        <button class="btn sm gh dgr" style="float:right;padding:0 6px" onclick="delLog('${pid}','${code}',${i})">刪除</button></div>
        <div class="bd">${esc(l.text)}</div></div>`).join('')}</div>`
    :`<div class="empty">還沒有進度日誌。每有進展就記一筆，結案時就是完整歷程。</div>`}
  </div>`;

  const docs=`<div class="modal-b">
    ${rel.length?`<table class="tbl"><thead><tr><th>名稱</th><th style="width:120px">文件編號</th>
      <th style="width:84px">流程狀態</th><th style="width:44px"></th></tr></thead>
      <tbody>${rel.map(f=>`<tr><td>${fileIcon(f.type)} ${esc(f.name)}</td><td class="num muted">${esc(f.no)}</td>
        <td><span class="pill ${flowCls(f.flow)}">${f.flow}</span></td>
        <td><button class="btn sm gh" onclick="editFile('${pid}','${f.id}')">⋯</button></td></tr>`).join('')}</tbody></table>`
    :`<div class="empty">這個任務底下還沒有文件</div>`}
    <div style="padding:14px 0 0"><button class="btn" onclick="addFileForTask('${pid}','${code}')">＋ 新增文件到這個任務</button></div>
  </div>`;

  const tabs=code?`<div class="mtabs">
    <button class="${taskTab==='info'?'on':''}" onclick="switchTaskTab('${pid}','${code}','info')">任務內容</button>
    <button class="${taskTab==='logs'?'on':''}" onclick="switchTaskTab('${pid}','${code}','logs')">進度日誌 ${(t.logs||[]).length||''}</button>
    <button class="${taskTab==='docs'?'on':''}" onclick="switchTaskTab('${pid}','${code}','docs')">關聯文件 ${rel.length||''}</button>
  </div>`:'';

  modal(code?`${t.code}　${esc(t.name)}`:'新增任務',
    tabs+(taskTab==='logs'?logs:taskTab==='docs'?docs:info),
    taskTab==='info'
      ? `${code?`<button class="btn gh dgr" style="margin-right:auto" onclick="delTask('${pid}','${code}')">刪除任務</button>`:''}
         <button class="btn" onclick="closeModal()">取消</button>
         <button class="btn pri" onclick="saveTask('${pid}','${code||''}')">儲存</button>`
      : `<button class="btn" onclick="closeModal()">關閉</button>`,
    true);
}
function saveTask(pid,code){
  const p=DB.projects.find(x=>x.id===pid);
  const c=val('t_code'), n=val('t_name');
  if(!c||!n) return toast('編碼與名稱為必填');
  if(!code&&p.tasks.some(t=>t.code===c)) return toast('此 WBS 編碼已存在');
  const data={code:c,name:n,dur:+val('t_dur')||1,deps:val('t_deps'),
    weight:+val('t_weight')||0, model:val('t_model'), ms:val('t_ms')==='1',
    owner:val('t_owner'), exec:val('t_exec'), hours:val('t_hours'),
    planStart:val('t_ps'), planEnd:val('t_pe'), actStart:val('t_as'), actEnd:val('t_ae'), expEnd:val('t_ee'),
    prog:clamp(+val('t_prog')||0,0,100), note:val('t_note')};
  if(code) Object.assign(p.tasks.find(t=>t.code===code),data);
  else{ p.tasks.push(Object.assign({logs:[]},data)); p.tasks.sort((a,b)=>cmpCode(a.code,b.code)); }
  save(); closeModal(); render(); toast('已儲存');
}
function cmpCode(a,b){
  const A=String(a).split('.').map(Number), B=String(b).split('.').map(Number);
  for(let i=0;i<Math.max(A.length,B.length);i++){ const d=(A[i]||0)-(B[i]||0); if(d) return d; }
  return 0;
}
function delTask(pid,code){
  const p=DB.projects.find(x=>x.id===pid);
  p.tasks=p.tasks.filter(t=>t.code!==code&&!t.code.startsWith(code+'.'));
  p.files.forEach(f=>{ if(f.task===code){ f.task=''; f.cat='其他文件'; } });
  save(); closeModal(); render(); toast('已刪除任務');
}
function addLog(pid,code){
  const text=val('l_text'); if(!text) return toast('請輸入進度說明');
  const t=DB.projects.find(x=>x.id===pid).tasks.find(t=>t.code===code);
  (t.logs=t.logs||[]).push({ts:today(),who:val('l_who'),text});
  save(); taskTab='logs'; render(); taskForm(pid,code); toast('已新增進度日誌');
}
function delLog(pid,code,i){
  const t=DB.projects.find(x=>x.id===pid).tasks.find(t=>t.code===code);
  t.logs.splice(i,1); save(); taskTab='logs'; render(); taskForm(pid,code);
}

/* ---- 文件 ---- */
function addFile(pid){ fileForm(pid,null,''); }
function addFileForTask(pid,code){ fileForm(pid,null,code); }
function editFile(pid,fid){ fileForm(pid,fid); }
function fileForm(pid,fid,presetTask){
  const p=DB.projects.find(x=>x.id===pid);
  const f=fid?p.files.find(x=>x.id===fid)
            :{folder:curFolder||p.folders[0].id,cat:presetTask?'任務相關':'專案基本資料相關',task:presetTask||'',
              name:'',no:'',type:'pdf',flowOwner:'',flow:'未送審',url:''};
  modal(fid?'編輯文件':'新增文件',`<div class="modal-b">
    <label class="field"><span>文件名稱 *</span><input id="d_name" value="${esc(f.name)}"></label>
    <div class="row2">
      <label class="field"><span>資料夾</span><select id="d_folder">${p.folders.map(o=>
        `<option value="${o.id}" ${f.folder===o.id?'selected':''}>${o.parent?'　└ ':''}${esc(o.name)}</option>`).join('')}</select></label>
      <label class="field"><span>文件編號</span><input id="d_no" value="${esc(f.no)}" placeholder="留空自動編號"></label>
    </div>
    <div class="row2">
      <label class="field"><span>文件分類</span><select id="d_cat">${DOC_CATEGORY.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
      <label class="field"><span>關聯 WBS 任務</span><select id="d_task"><option value="">（不關聯）</option>
        ${p.tasks.filter(t=>!t._sum).map(t=>`<option value="${t.code}" ${f.task===t.code?'selected':''}>${t.code} ${esc(t.name)}</option>`).join('')}</select></label>
    </div>
    <div class="row3">
      <label class="field"><span>格式</span><input id="d_type" value="${esc(f.type)}" placeholder="pdf / dwg / xlsx"></label>
      <label class="field"><span>流程執行者</span><input id="d_fo" value="${esc(f.flowOwner)}"></label>
      <label class="field"><span>流程狀態</span><select id="d_flow">${FLOW_STATUS.map(s=>`<option ${f.flow===s?'selected':''}>${s}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>雲端硬碟連結</span><input id="d_url" value="${esc(f.url)}" placeholder="https://drive.google.com/…"></label>
    <div class="muted" style="font-size:12px">檔案本體放公司雲端硬碟，這裡記錄索引、審核流程與所屬任務。</div>
    </div>`,
    `${fid?`<button class="btn gh dgr" style="margin-right:auto" onclick="delFile('${pid}','${fid}')">刪除</button>`:''}
     <button class="btn" onclick="closeModal()">取消</button>
     <button class="btn pri" onclick="saveFile('${pid}','${fid||''}')">儲存</button>`);
}
function saveFile(pid,fid){
  const p=DB.projects.find(x=>x.id===pid);
  const name=val('d_name'); if(!name) return toast('請輸入文件名稱');
  const folder=val('d_folder'), task=val('d_task');
  const data={folder,name,no:val('d_no')||nextDocNo(p,folder),type:val('d_type'),
    cat:task?'任務相關':val('d_cat'), task,
    flowOwner:val('d_fo'),flow:val('d_flow'),url:val('d_url'),mt:Date.now()};
  if(fid) Object.assign(p.files.find(f=>f.id===fid),data);
  else p.files.push(Object.assign({id:uid()},data));
  save(); closeModal(); render(); toast('已儲存');
}
function delFile(pid,fid){
  const p=DB.projects.find(x=>x.id===pid);
  p.files=p.files.filter(f=>f.id!==fid); save(); closeModal(); render(); toast('已刪除');
}
function addFolder(pid){
  const p=DB.projects.find(x=>x.id===pid);
  modal('新增資料夾',`<div class="modal-b">
    <div class="row2">
      <label class="field"><span>編號 *</span><input id="k_id" placeholder="例 7000"></label>
      <label class="field"><span>上層資料夾</span><select id="k_parent"><option value="">（最上層）</option>
        ${p.folders.filter(f=>!f.parent).map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label>
    </div>
    <label class="field"><span>名稱 *</span><input id="k_name" placeholder="例 維運紀錄"></label></div>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn pri" onclick="saveFolder('${pid}')">建立</button>`);
}
function saveFolder(pid){
  const p=DB.projects.find(x=>x.id===pid);
  const id=val('k_id'), nm=val('k_name');
  if(!id||!nm) return toast('編號與名稱為必填');
  if(p.folders.some(f=>f.id===id)) return toast('此編號已存在');
  p.folders.push({id,name:id+' '+nm,parent:val('k_parent')});
  p.folders.sort((a,b)=>a.id.localeCompare(b.id));
  save(); closeModal(); render(); toast('資料夾已建立');
}
function addMember(pid){
  modal('新增成員',`<div class="modal-b"><div class="row3">
    <label class="field"><span>姓名 *</span><input id="m_name"></label>
    <label class="field"><span>團隊身份</span><select id="m_role">${ROLES.map(r=>`<option ${r==='工作人員'?'selected':''}>${r}</option>`).join('')}</select></label>
    <label class="field"><span>單位</span><input id="m_dept" placeholder="工程管理部"></label></div></div>`,
    `<button class="btn" onclick="closeModal()">取消</button>
     <button class="btn pri" onclick="saveMember('${pid}')">新增</button>`);
}
function saveMember(pid){
  const nm=val('m_name'); if(!nm) return toast('請輸入姓名');
  DB.projects.find(x=>x.id===pid).members.push({name:nm,role:val('m_role'),dept:val('m_dept')});
  save(); closeModal(); render();
}
function delMember(pid,i){ DB.projects.find(x=>x.id===pid).members.splice(i,1); save(); render(); }

/* ---- 備份 / 匯出 ---- */
function openBackup(){
  let size='—';
  try{ size=((localStorage.getItem(KEY)||'').length/1024).toFixed(1)+' KB'; }catch(e){}
  modal('資料備份與還原',`<div class="modal-b">
    <p class="muted" style="font-size:13px;margin-top:0">資料存在這台電腦的瀏覽器中（約 ${size}）。
      匯出的 JSON 可放公司雲端硬碟，換電腦時再匯入。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">
      <button class="btn pri" onclick="exportJSON()">⬇ 匯出全部資料 (JSON)</button>
      <button class="btn" onclick="document.getElementById('imp').click()">⬆ 匯入 JSON</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(this)">
    </div>
    <div class="muted" style="font-size:12.5px;border-top:1px solid var(--line-2);padding-top:12px">
      共 ${DB.projects.length} 個專案、${DB.projects.reduce((a,p)=>a+p.tasks.length,0)} 項任務、
      ${DB.projects.reduce((a,p)=>a+p.files.length,0)} 筆文件、
      ${DB.projects.reduce((a,p)=>a+p.tasks.reduce((b,t)=>b+(t.logs||[]).length,0),0)} 筆進度日誌、
      ${DB.projects.reduce((a,p)=>a+(p.forms||[]).length,0)} 份表單（${(DB.formTpls||[]).length} 個範本）。
    </div></div>`,`<button class="btn" onclick="closeModal()">關閉</button>`);
}
function download(name,text,mime){
  const b=new Blob(['﻿'+text],{type:mime||'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportJSON(){
  const clean=JSON.parse(JSON.stringify(DB,(k,v)=>k.startsWith('_')?undefined:v));
  download(`專案管理備份_${today()}.json`,JSON.stringify(clean,null,2),'application/json');
  toast('已匯出，請放到雲端硬碟');
}
function importJSON(el){
  const f=el.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const d=JSON.parse(r.result); if(!d.projects) throw 0;
      DB=migrate(d); save(); closeModal(); render(); toast(`已匯入 ${d.projects.length} 個專案`);
    }catch(e){ toast('檔案格式不正確'); } };
  r.readAsText(f);
}
function exportCSV(pid){
  const p=DB.projects.find(x=>x.id===pid);
  const head=['編碼','任務名稱','權重','進度模型','原定工期','前置任務','預定開始','預定完成',
    '實際開始','實際完成','預期完成','預定進度%','實際進度%','偏差%','狀態','浮時','負責人','執行人','最新進度說明'];
  const rows=p.tasks.map(t=>{
    const last=(t.logs||[]).slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts)))[0];
    return [t.code,t.name,t.weight,t._sum?'':t.model,t._sum?'':t.dur,t.deps||'',
      fmt(t._s),fmt(t._e),t.actStart||'',t.actEnd||'',t.expEnd||'',
      pct(t._plan),pct(t._prog),pct(variance(t)),t._sum?'':taskStatus(t).k,
      t._sum?'':(t._float>=0?t._float:0),t.owner||'',t.exec||'',last?`[${last.ts}] ${last.text}`:''];
  });
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  download(`${p.name}_進度_${today()}.csv`,csv,'text/csv;charset=utf-8');
}

function toggleSide(){
  const s=$('#side'), m=$('#sideMask');
  const on=!s.classList.contains('open');
  s.classList.toggle('open',on); m.classList.toggle('on',on);
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',cur);
  DB.settings=DB.settings||{}; DB.settings.theme=cur; save();
}
function toast(m){
  const d=document.createElement('div'); d.className='toast'; d.textContent=m;
  document.body.appendChild(d); setTimeout(()=>d.remove(),2200);
}

document.documentElement.setAttribute('data-theme',(DB.settings&&DB.settings.theme)||'light');
if(location.hash&&location.hash.startsWith('#/')) CURHASH=location.hash;
parseHash(); render();
// 開場就先測一次能不能存檔，不要等使用者改了一堆才發現
setTimeout(()=>{
  try{ localStorage.setItem(KEY+'_t','1'); localStorage.removeItem(KEY+'_t'); }
  catch(e){ CAN_SAVE=false; warnNoSave(); }
},400);
</script>
